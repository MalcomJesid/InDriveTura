<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="volverAtras()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Seleccionar Ruta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Resumen de selecciones anteriores -->
  <ion-item color="light" lines="none">
    <ion-icon name="person-circle-outline" slot="start" color="primary"></ion-icon>
    <ion-label>
      <p>Conductor</p>
      <h3>{{ perfilNombre }}</h3>
    </ion-label>
  </ion-item>
  <ion-item color="light" lines="full">
    <ion-icon name="car-outline" slot="start" color="primary"></ion-icon>
    <ion-label>
      <p>Vehículo</p>
      <h3>{{ vehiculoPlaca }}</h3>
    </ion-label>
  </ion-item>

  <!-- Mientras carga -->
  <div *ngIf="cargando" style="text-align: center; margin-top: 40px;">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando rutas...</p>
  </div>

  <!-- Si hay error -->
  <div *ngIf="error" style="text-align: center; margin-top: 40px;">
    <ion-icon name="alert-circle-outline" color="danger" size="large"></ion-icon>
    <p>{{ error }}</p>
  </div>

  <!-- Lista de rutas -->
  <ion-list *ngIf="!cargando && !error">
    <ion-list-header>
      <ion-label>
        <h2>Rutas disponibles</h2>
        <p>{{ rutas.length }} rutas registradas</p>
      </ion-label>
    </ion-list-header>

    <ion-item
      *ngFor="let ruta of rutas"
      button
      detail="true"
      (click)="seleccionarRuta(ruta)">
      <ion-icon
        name="map-outline"
        slot="start"
        [style.color]="ruta.color_hex || '#2E75B6'">
      </ion-icon>
      <ion-label>
        <h3>{{ ruta.nombre_ruta }}</h3>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
