<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-button (click)="volverAtras()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Resumen</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div style="text-align: center; margin-top: 60px; padding: 20px;">
    <ion-icon name="checkmark-circle-outline" color="success" style="font-size: 80px;"></ion-icon>
    <h2>Todo listo</h2>
    <p>Confirma los datos antes de iniciar el recorrido</p>
  </div>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Resumen de selección</ion-card-title>
    </ion-card-header>
    <ion-card-content>

      <ion-item lines="full">
        <ion-icon name="person-circle-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <p>Conductor</p>
          <h3>{{ perfilNombre }}</h3>
        </ion-label>
      </ion-item>

      <ion-item lines="full">
        <ion-icon name="car-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <p>Vehículo</p>
          <h3>{{ vehiculoPlaca }}</h3>
        </ion-label>
      </ion-item>

      <ion-item lines="none">
        <ion-icon name="map-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <p>Ruta</p>
          <h3>{{ rutaNombre }}</h3>
        </ion-label>
      </ion-item>

    </ion-card-content>
  </ion-card>

  <div style="padding: 20px;">
    <ion-button expand="block" color="success" size="large" disabled>
      <ion-icon name="play-circle-outline" slot="start"></ion-icon>
      Iniciar Recorrido (Semana 3)
    </ion-button>
  </div>

</ion-content>
